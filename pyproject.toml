[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-only-maritime-localization"
version = "0.1.0"
description = "Simulation benchmarks for bearing-only maritime localization with incomplete object identity."
authors = [{ name = "J.C. Vaught", email = "jvaught@sc.edu" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "shapely>=2.0", "pyproj>=3.6"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13.0; sys_platform == \"linux\""]

[project.scripts]
bearing-localization = "bearing_localization.cli:main"
bearing-localization-search = "bearing_localization.search_cli:main"
bearing-localization-evaluate = "bearing_localization.evaluate_cli:main"
bearing-simulator = "bearing_localization.simulator.cli:main"
bearing-benchmark = "bearing_localization.benchmark_cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "ty>=0.0.1a0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bearing_localization*", "maritime_localization_shared*", "maritime_localization_ingest*"]
namespaces = false

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"
