[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-only-maritime-localization"
version = "0.1.0"
description = "Simulation benchmarks for bearing-only maritime localization with incomplete object identity."
authors = [{ name = "J.C. Vaught", email = "jvaught@sc.edu" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "shapely>=2.0", "pyproj>=3.6"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13.0; sys_platform == \"linux\""]

[project.scripts]
bearing-localization = "maritime.cli:main"
bearing-localization-search = "maritime.search_cli:main"
bearing-localization-evaluate = "maritime.evaluate_cli:main"
bearing-simulator = "maritime.simulator.cli:main"
bearing-benchmark = "maritime.benchmark_cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "ty>=0.0.1a0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["maritime", "maritime.*"]
namespaces = false

[tool.uv]
package = true

[tool.ruff]
line-length = 100
extend-exclude = [".agent-work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".agent-work"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".agent-work", ".git", ".venv", "build", "dist", "node_modules", "venv", "*.egg", "CVS", "_darcs", "{arch}"]

[tool.setuptools.package-data]
"maritime.search.gpu.resident" = ["*.cu"]
